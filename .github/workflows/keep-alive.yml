# Ping externe du backend Render : réveille l'instance gratuite si elle s'est
# mise en veille (crash, redémarrage) et complète le KeepAliveScheduler interne.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping backend
        run: |
          for endpoint in categories departments; do
            curl -fsS -o /dev/null -w "$endpoint: HTTP %{http_code} en %{time_total}s\n" \
              --retry 3 --retry-delay 30 --retry-all-errors --max-time 120 \
              "https://yasmine-store-2026-1.onrender.com/api/$endpoint"
          done
