spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/ecommerce?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
logging.level.org.springframework.security=DEBUG
server.port=${PORT:8081}

# Secrets (obligatoires, à définir dans les variables d'environnement Render)
app.jwt.secret=${JWT_SECRET}
app.admin.password=${ADMIN_PASSWORD}

# Emails via l'API HTTPS de Brevo (Render gratuit bloque le SMTP)
app.brevo.api-key=${BREVO_API_KEY:}
# Images sur Cloudinary (le disque Render est effacé à chaque déploiement)
app.cloudinary.url=${CLOUDINARY_URL:}
app.frontend.url=${FRONTEND_URL:https://yasmine-store-2026.vercel.app}

# Photos de téléphone : la limite par défaut (1 Mo) est trop basse
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration (Gmail SMTP over SSL - port 465)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=yasminestoresf@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Store notification email recipient
app.store.notification-email=yasminestoresf@gmail.com